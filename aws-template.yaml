AWSTemplateFormatVersion: '2010-09-09'
Description: AWS First Cloud Journey - Participant Management System with ALB + Auto Scaling + RDS Multi-AZ + Secrets Manager

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Network Configuration"
        Parameters:
          - VpcCidr
          - PublicSubnet1Cidr
          - PublicSubnet2Cidr
          - AppSubnet1Cidr
          - AppSubnet2Cidr
          - DbSubnet1Cidr
          - DbSubnet2Cidr
      - Label:
          default: "Application Configuration"
        Parameters:
          - KeyName
          - AppInstanceType
          - DesiredCapacity
          - MinSize
          - MaxSize
      - Label:
          default: "Database Configuration"
        Parameters:
          - DBEngine
          - DBInstanceClass
          - DBName
          - DBUsername
    ParameterLabels:
      VpcCidr:
        default: "VPC CIDR Block"
      KeyName:
        default: "EC2 Key Pair"
      AppInstanceType:
        default: "Application Instance Type"
      DBEngine:
        default: "Database Engine"
      DBInstanceClass:
        default: "Database Instance Class"

Parameters:
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.20.0.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.20.1.0/24
  AppSubnet1Cidr:
    Type: String
    Default: 10.20.10.0/24
  AppSubnet2Cidr:
    Type: String
    Default: 10.20.11.0/24
  DbSubnet1Cidr:
    Type: String
    Default: 10.20.20.0/24
  DbSubnet2Cidr:
    Type: String
    Default: 10.20.21.0/24

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: SSH key for break-glass access (instances are private)

  DesiredCapacity:
    Type: Number
    Default: 2
  MinSize:
    Type: Number
    Default: 2
  MaxSize:
    Type: Number
    Default: 6

  AppInstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium, t3.large]
    Description: EC2 instance type for the application servers

  DBEngine:
    Type: String
    AllowedValues: [mysql, postgres]
    Default: mysql
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
  DBName:
    Type: String
    Default: lib
    Description: Database name for FCJ Management System
  DBUsername:
    Type: String
    Default: root
    Description: Database master username

Mappings:
  EngineMap:
    mysql:
      Port: '3306'
      Family: mysql8.0
    postgres:
      Port: '5432'
      Family: postgres16

Resources:
  # -------------------- VPC & Subnets (2 AZs) --------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: FCJ-Management-VPC}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  AttachIgw:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Pick two AZs dynamically
  AZ1: {Type: AWS::SSM::Parameter::Value<String>, Default: /aws/service/global-infrastructure/regions/${AWS::Region}/availability-zone/az1}
  AZ2: {Type: AWS::SSM::Parameter::Value<String>, Default: /aws/service/global-infrastructure/regions/${AWS::Region}/availability-zone/az2}
  # (Note: Some partitions don’t have those SSM paths; if error, replace with !Select/!GetAZs)

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [1, !GetAZs '']

  AppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref AppSubnet1Cidr
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs '']

  AppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref AppSubnet2Cidr
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [1, !GetAZs '']

  DbSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref DbSubnet1Cidr
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs '']

  DbSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref DbSubnet2Cidr
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [1, !GetAZs '']

  # -------------------- Routing --------------------
  PublicRt:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref VPC}
  PublicRtDefault:
    Type: AWS::EC2::Route
    DependsOn: AttachIgw
    Properties:
      RouteTableId: !Ref PublicRt
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  AssocPub1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRt}
  AssocPub2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRt}

  NatEip:
    Type: AWS::EC2::EIP
    Properties: {Domain: vpc}
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1

  AppRt:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref VPC}
  AppRtDefault:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRt
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  AssocApp1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnet1, RouteTableId: !Ref AppRt}
  AssocApp2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnet2, RouteTableId: !Ref AppRt}

  DbRt:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref VPC}
  AssocDb1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DbSubnet1, RouteTableId: !Ref DbRt}
  AssocDb2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DbSubnet2, RouteTableId: !Ref DbRt}

  # -------------------- Security Groups --------------------
  ALBSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VPC
      GroupDescription: Allow HTTP from Internet
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
      Tags: [{Key: Name, Value: ALB-SG}]

  AppSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VPC
      GroupDescription: Allow Node.js app traffic from ALB
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref ALBSG}
        - {IpProtocol: tcp, FromPort: 3333, ToPort: 3333, SourceSecurityGroupId: !Ref ALBSG}
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: 10.20.0.0/16}  # SSH from VPC
      Tags: [{Key: Name, Value: FCJ-App-SG}]

  DbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VPC
      GroupDescription: Allow DB from AppSG
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !FindInMap [EngineMap, !Ref DBEngine, Port]
          ToPort: !FindInMap [EngineMap, !Ref DBEngine, Port]
          SourceSecurityGroupId: !Ref AppSG
      Tags: [{Key: Name, Value: FCJ-DB-SG}]

  # -------------------- Secrets Manager (DB password) --------------------
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Master DB password (auto-generated)
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBUsername}"}'
        GenerateStringKey: password
        PasswordLength: 20
        ExcludePunctuation: true

  # -------------------- RDS (Multi-AZ) --------------------
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for RDS Multi-AZ
      SubnetIds: [!Ref DbSubnet1, !Ref DbSubnet2]

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: !Ref DBEngine
      DBInstanceClass: !Ref DBInstanceClass
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}::password}}"
      MultiAZ: true
      AllocatedStorage: 20
      StorageEncrypted: true
      VPCSecurityGroups: [!GetAtt DbSG.GroupId]
      DBSubnetGroupName: !Ref DbSubnetGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: false

  # -------------------- IAM Role for EC2 --------------------
  AppInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadDbSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DbSecret

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref AppInstanceRole]

  # -------------------- ALB + Target Group + Listener --------------------
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!Ref ALBSG]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      TargetType: instance
      Protocol: HTTP
      Port: 3333
      HealthCheckPath: /
      HealthCheckPort: 3333
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: '200'}

  ALBListenerHttp:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # -------------------- Launch Template & ASG (private subnets) --------------------
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref AppInstanceType
        IamInstanceProfile: {Arn: !GetAtt AppInstanceProfile.Arn}
        KeyName: !Ref KeyName
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: false
            Groups: [!Ref AppSG]
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -e
            
            # Update system and install dependencies
            yum update -y
            yum install -y git jq nginx
            
            # Install Node.js 18.x
            curl -fsSL https://rpm.nodesource.com/setup_18.x | bash -
            yum install -y nodejs
            
            # Create app user and directory
            useradd -m -s /bin/bash fcjapp
            mkdir -p /opt/fcj-management
            chown fcjapp:fcjapp /opt/fcj-management
            
            # Clone the application
            cd /opt/fcj-management
            git clone https://github.com/vanhoangkha/AWS-First-Cloud-Journey-Participant-Management-System.git .
            chown -R fcjapp:fcjapp /opt/fcj-management
            
            # Install npm dependencies
            sudo -u fcjapp npm install
            
            # Fetch DB credentials from Secrets Manager
            REGION="${AWS::Region}"
            SECRET_JSON=$(aws secretsmanager get-secret-value --region "$REGION" --secret-id "${DbSecret}" --query SecretString --output text)
            DB_USER=$(echo "$SECRET_JSON" | jq -r '.username')
            DB_PASS=$(echo "$SECRET_JSON" | jq -r '.password')
            DB_HOST="${DBInstance.Endpoint.Address}"
            DB_PORT="${EngineMap.${DBEngine}.Port}"
            
            # Create environment file
            cat > /opt/fcj-management/.env <<EOF
            PORT=3333
            DB_HOST=$DB_HOST
            DB_NAME=${DBName}
            DB_USER=$DB_USER
            DB_PASS=$DB_PASS
            NODE_ENV=production
            EOF
            chown fcjapp:fcjapp /opt/fcj-management/.env
            chmod 600 /opt/fcj-management/.env
            
            # Create systemd service for the Node.js app
            cat > /etc/systemd/system/fcj-management.service <<EOF
            [Unit]
            Description=AWS FCJ Management System
            After=network.target
            
            [Service]
            Type=simple
            User=fcjapp
            WorkingDirectory=/opt/fcj-management
            ExecStart=/usr/bin/node app.js
            Restart=always
            RestartSec=10
            Environment=NODE_ENV=production
            
            [Install]
            WantedBy=multi-user.target
            EOF
            
            # Configure Nginx as reverse proxy
            cat > /etc/nginx/conf.d/fcj-management.conf <<EOF
            server {
                listen 80;
                server_name _;
                
                location / {
                    proxy_pass http://localhost:3333;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_cache_bypass \$http_upgrade;
                }
                
                location /health {
                    access_log off;
                    return 200 "healthy\n";
                    add_header Content-Type text/plain;
                }
            }
            EOF
            
            # Remove default nginx config
            rm -f /etc/nginx/conf.d/default.conf
            
            # Start services
            systemctl daemon-reload
            systemctl enable fcj-management
            systemctl start fcj-management
            systemctl enable nginx
            systemctl start nginx
            
            # Wait for database to be ready and create table
            sleep 30
            sudo -u fcjapp node -e "
            const mysql = require('mysql');
            const connection = mysql.createConnection({
              host: '$DB_HOST',
              user: '$DB_USER',
              password: '$DB_PASS',
              database: '${DBName}'
            });
            
            connection.connect((err) => {
              if (err) {
                console.error('Database connection failed:', err);
                return;
              }
              
              const createTableQuery = \`
                CREATE TABLE IF NOT EXISTS user (
                  id INT NOT NULL AUTO_INCREMENT,
                  first_name VARCHAR(45) NOT NULL,
                  last_name VARCHAR(45) NOT NULL,
                  email VARCHAR(45) NOT NULL,
                  phone VARCHAR(45) NOT NULL,
                  comments TEXT NOT NULL,
                  status VARCHAR(10) NOT NULL DEFAULT 'active',
                  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                  updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                  PRIMARY KEY (id),
                  UNIQUE KEY email_UNIQUE (email)
                ) ENGINE = InnoDB;
              \`;
              
              connection.query(createTableQuery, (err) => {
                if (err) {
                  console.error('Error creating table:', err);
                } else {
                  console.log('User table created successfully');
                  
                  // Insert sample data
                  const sampleData = [
                    ['Amanda', 'Nunes', 'anunes@fcj.com', '012345 678910', 'Professional participant', 'active'],
                    ['Alexander', 'Volkanovski', 'avolkanovski@fcj.com', '012345 678911', 'Advanced learner', 'active'],
                    ['Khabib', 'Nurmagomedov', 'knurmagomedov@fcj.com', '012345 678912', 'Cloud architecture focus', 'active']
                  ];
                  
                  const insertQuery = 'INSERT IGNORE INTO user (first_name, last_name, email, phone, comments, status) VALUES ?';
                  connection.query(insertQuery, [sampleData], (err) => {
                    if (err) {
                      console.error('Error inserting sample data:', err);
                    } else {
                      console.log('Sample data inserted successfully');
                    }
                    connection.end();
                  });
                }
              });
            });
            " || echo "Database setup failed, app will run in demo mode"

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: [!Ref AppSubnet1, !Ref AppSubnet2]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 120
      MetricsCollection: [{Granularity: "1Minute"}]
      Tags:
        - Key: Name
          Value: FCJ-Management-App
          PropagateAtLaunch: true
        - Key: Project
          Value: AWS-First-Cloud-Journey
          PropagateAtLaunch: true

  # Target Tracking Scaling on CPU 50%
  CpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 50.0

  # Example CloudWatch alarms (optional classic step scaling)
  HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: FCJ Management System - CPU > 70% for 5 minutes
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref AutoScalingGroup
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold

  # Scheduled scaling example (peak hours 08:00-18:00 Mon-Fri, region local time)
  ScaleOutSchedule:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      Recurrence: "0 1 * * 1-5"    # 08:00 GMT+7 ≈ 01:00 UTC
      MinSize: 2
      DesiredCapacity: 4
      MaxSize: 6

  ScaleInSchedule:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      Recurrence: "0 11 * * 1-5"   # 18:00 GMT+7 ≈ 11:00 UTC
      MinSize: 2
      DesiredCapacity: 2
      MaxSize: 6

Outputs:
  ApplicationURL:
    Description: AWS FCJ Management System URL
    Value: !Sub "http://${ALB.DNSName}"
    Export:
      Name: !Sub "${AWS::StackName}-ApplicationURL"
  
  ALBDNS:
    Description: Application Load Balancer DNS Name
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-ALB-DNS"
  
  RDSEndpoint:
    Description: RDS MySQL endpoint address
    Value: !GetAtt DBInstance.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-RDS-Endpoint"
  
  DatabaseName:
    Description: Database name for FCJ Management System
    Value: !Ref DBName
    Export:
      Name: !Sub "${AWS::StackName}-DB-Name"
  
  VPCId:
    Description: VPC ID for FCJ Management System
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-VPC-ID"
  
  AppSubnets:
    Description: Application subnets used by Auto Scaling Group
    Value: !Sub "${AppSubnet1}, ${AppSubnet2}"
    Export:
      Name: !Sub "${AWS::StackName}-App-Subnets"
